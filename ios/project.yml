name: XiaokeFreecell
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XiaokeFreecell:
    type: application
    platform: iOS
    sources:
      - path: XiaokeFreecell
      - path: web            # 和 Android 版同一份手機版網頁（sync.sh 從 ../mobile/www 複製進來），整個資料夾放進 App
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokefreecell
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad（含 iPad Pro）
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program（個人）；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaokeFreecell/Info.plist
      properties:
        CFBundleDisplayName: 小柯接龍
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        # iPhone、iPad 都只橫放（接龍牌桌是橫的）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: 與遠端玩家語音通話需要使用麥克風。
        UIFileSharingEnabled: true
schemes:
  XiaokeFreecell:
    build:
      targets:
        XiaokeFreecell: all
    run:
      config: Debug
    archive:
      config: Release
